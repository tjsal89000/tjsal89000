<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="YGRHASH - 5년차 백엔드 개발자">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b33"/>
      <stop offset="1" stop-color="#1f1147"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa"/>
      <stop offset="0.5" stop-color="#80a8ff"/>
      <stop offset="1" stop-color="#c38bff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#80a8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#80a8ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .node { fill: #80a8ff; }
      .link { stroke: #80a8ff; stroke-opacity: 0.25; stroke-width: 1.5; fill: none; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .pulse.d1 { animation-delay: 1s; }
      .pulse.d2 { animation-delay: 2s; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <ellipse cx="600" cy="140" rx="420" ry="150" fill="url(#glow)"/>

  <!-- 좌우 장식: 서버 노드끼리 이어진 네트워크 -->
  <g>
    <path class="link" d="M70 70 L170 120 L120 210 L230 240"/>
    <path class="link" d="M170 120 L260 80"/>
    <circle class="node pulse" cx="70" cy="70" r="5"/>
    <circle class="node pulse d1" cx="170" cy="120" r="6"/>
    <circle class="node pulse d2" cx="120" cy="210" r="5"/>
    <circle class="node pulse" cx="230" cy="240" r="4"/>
    <circle class="node pulse d1" cx="260" cy="80" r="4"/>
  </g>
  <g>
    <path class="link" d="M1130 60 L1030 110 L1090 200 L970 235"/>
    <path class="link" d="M1030 110 L940 70"/>
    <circle class="node pulse d2" cx="1130" cy="60" r="5"/>
    <circle class="node pulse" cx="1030" cy="110" r="6"/>
    <circle class="node pulse d1" cx="1090" cy="200" r="5"/>
    <circle class="node pulse d2" cx="970" cy="235" r="4"/>
    <circle class="node pulse" cx="940" cy="70" r="4"/>
  </g>

  <text x="600" y="158" text-anchor="middle" fill="url(#title)"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="10">YGRHASH</text>

  <text x="600" y="214" text-anchor="middle" fill="#c9d1d9"
        font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="26" font-weight="500" letter-spacing="2">5년차 백엔드 개발자<tspan class="caret" fill="#80a8ff"> _</tspan></text>

  <text x="600" y="252" text-anchor="middle" fill="#8b949e"
        font-family="'Consolas', 'SFMono-Regular', Menlo, monospace" font-size="16" letter-spacing="1">Java · Spring Boot · Kafka · Redis · Kubernetes · AWS</text>
</svg>
